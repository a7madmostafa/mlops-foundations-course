[project]
name = "flight-delays"
version = "0.1.0"
description = "US flight-delay prediction pipeline"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
]

[project.scripts]
flight-delays = "flight_delays.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
